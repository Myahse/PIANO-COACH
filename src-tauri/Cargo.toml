[package]
name = "piano-coach"
version = "0.1.0"
description = "Piano Coach desktop app"
authors = ["Piano Coach"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "piano_coach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
